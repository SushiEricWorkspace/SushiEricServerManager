# WindowsとmacOSのインストーラーを作成する。手動実行（workflow_dispatch）だけで動く。
#
# 実行の制限:
# - 人間の明示的な許可なく実行しない。AIは`gh workflow run`などで実行しない（AGENTS.mdを参照）。
# - push、pull_request、scheduleなど、自動で実行されるトリガーを追加しない。
# - 無料枠を使い切らないよう、対象のOSは必要なものだけを選ぶ。macOSのランナーは、非公開リポジトリでは
#   Linuxの10倍、Windowsは2倍の分数を消費する。
#
# 事前の準備:
# - SushiEricDataModelは非公開のため、リポジトリのシークレットDATA_MODEL_REPO_TOKENに、SushiEricDataModelの内容を読み取れるトークンを登録する。
#
# 手順は docs/update/release-guide.md を参照する。
name: Build Installer

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'インストーラーを作成するOS'
        type: choice
        options:
          - windows
          - macos
          - both
        default: windows
      data_model_ref:
        description: 'ビルドに使うSushiEricDataModelのブランチまたはタグ'
        type: string
        default: develop
      data_model_release_version:
        description: 'SushiEricDataModelの正式版のバージョン（例: 0.2.0）。省略すると、開発版のSushiEricDataModelで作成する'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-installer
  cancel-in-progress: false

env:
  # 入力値は、スクリプトへ直接埋め込まず、環境変数として渡す。
  DATA_MODEL_REF: ${{ inputs.data_model_ref }}
  DATA_MODEL_RELEASE_VERSION: ${{ inputs.data_model_release_version }}

jobs:
  windows:
    if: ${{ inputs.os == 'windows' || inputs.os == 'both' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 入力とトークンを確認する
        env:
          DATA_MODEL_REPO_TOKEN: ${{ secrets.DATA_MODEL_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_MODEL_REPO_TOKEN" ]; then
            echo "::error::シークレットDATA_MODEL_REPO_TOKENが登録されていません。SushiEricDataModelを読み取れるトークンを登録してください。"
            exit 1
          fi
          if [ -n "$DATA_MODEL_RELEASE_VERSION" ] && ! [[ "$DATA_MODEL_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::data_model_release_versionはX.Y.Z形式で指定してください（vを付けない）: $DATA_MODEL_RELEASE_VERSION"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: SushiEricServerManager

      - uses: actions/checkout@v4
        with:
          repository: SushiEricWorkspace/SushiEricDataModel
          ref: ${{ inputs.data_model_ref }}
          token: ${{ secrets.DATA_MODEL_REPO_TOKEN }}
          path: SushiEricDataModel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: SushiEricDataModelを発行する
        working-directory: SushiEricDataModel
        run: |
          if [ -n "$DATA_MODEL_RELEASE_VERSION" ]; then
            ./gradlew publishRelease "-PdataModelReleaseVersion=$DATA_MODEL_RELEASE_VERSION"
          else
            ./gradlew publishDevelopment
          fi

      - name: WiXをPATHへ追加する
        run: |
          wix='C:/Program Files (x86)/WiX Toolset v3.14/bin'
          if [ ! -d "$wix" ]; then
            echo "::error::WiX Toolset v3.14が見つかりません: $wix"
            exit 1
          fi
          echo "$wix" >> "$GITHUB_PATH"

      - name: インストーラーを作成する
        working-directory: SushiEricServerManager
        run: |
          if [ -n "$DATA_MODEL_RELEASE_VERSION" ]; then
            ./gradlew releaseWindowsInstaller "-PdataModelReleaseVersion=$DATA_MODEL_RELEASE_VERSION"
          else
            ./gradlew renameWindowsInstaller
          fi

      - name: 成果物をアップロードする
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: SushiEricServerManager/build/release-installer/*.exe
          if-no-files-found: error
          retention-days: 3

  macos:
    if: ${{ inputs.os == 'macos' || inputs.os == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 入力とトークンを確認する
        env:
          DATA_MODEL_REPO_TOKEN: ${{ secrets.DATA_MODEL_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_MODEL_REPO_TOKEN" ]; then
            echo "::error::シークレットDATA_MODEL_REPO_TOKENが登録されていません。SushiEricDataModelを読み取れるトークンを登録してください。"
            exit 1
          fi
          if [ -n "$DATA_MODEL_RELEASE_VERSION" ] && ! [[ "$DATA_MODEL_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::data_model_release_versionはX.Y.Z形式で指定してください（vを付けない）: $DATA_MODEL_RELEASE_VERSION"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: SushiEricServerManager

      - uses: actions/checkout@v4
        with:
          repository: SushiEricWorkspace/SushiEricDataModel
          ref: ${{ inputs.data_model_ref }}
          token: ${{ secrets.DATA_MODEL_REPO_TOKEN }}
          path: SushiEricDataModel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: SushiEricDataModelを発行する
        working-directory: SushiEricDataModel
        run: |
          if [ -n "$DATA_MODEL_RELEASE_VERSION" ]; then
            ./gradlew publishRelease "-PdataModelReleaseVersion=$DATA_MODEL_RELEASE_VERSION"
          else
            ./gradlew publishDevelopment
          fi

      - name: インストーラーを作成する
        working-directory: SushiEricServerManager
        run: |
          if [ -n "$DATA_MODEL_RELEASE_VERSION" ]; then
            ./gradlew releaseMacDmg "-PdataModelReleaseVersion=$DATA_MODEL_RELEASE_VERSION"
          else
            ./gradlew renameMacDmg
          fi

      - name: 成果物をアップロードする
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: SushiEricServerManager/build/release-installer/*.dmg
          if-no-files-found: error
          retention-days: 3
